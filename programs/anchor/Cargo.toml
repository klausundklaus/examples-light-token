[workspace]
resolver = "2"
members = [
    "escrow",
    "fundraiser",
    "light-token-minter",
    "token-swap",
    "shared-test-utils",
    "basic-instructions/approve",
    "basic-instructions/burn",
    "basic-instructions/close",
    "basic-instructions/create-associated-token-account",
    "basic-instructions/create-mint",
    "basic-instructions/create-token-account",
    "basic-instructions/freeze",
    "basic-instructions/mint-to",
    "basic-instructions/revoke",
    "basic-instructions/test-utils",
    "basic-instructions/thaw",
    "basic-instructions/transfer-checked",
    "basic-instructions/transfer-interface",
    "basic-macros/counter",
    "basic-macros/create-associated-token-account",
    "basic-macros/create-mint",
    "basic-macros/create-token-account",
    "create-and-transfer",
]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
# Pin blake3 version for solana-program compatibility
blake3 = { version = "=1.5.5", default-features = false }

# Anchor
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"

# Solana
solana-sdk = "2"
solana-program = "2"
solana-pubkey = "2"
solana-msg = "2"
solana-account-info = "2"
solana-program-error = "2"
solana-instruction = "2"
solana-keypair = "2"
solana-signer = "2"

# SPL
spl-token = "7"
spl-token-2022 = "7"
spl-pod = "0.5"

# Light Protocol (pinned to fix/authority-owner-mutability branch)
light-sdk = { git = "https://github.com/Lightprotocol/light-protocol", branch = "fix/authority-owner-mutability", features = ["anchor", "v2", "cpi-context"] }
light-sdk-macros = { git = "https://github.com/Lightprotocol/light-protocol", branch = "fix/authority-owner-mutability" }
light-sdk-types = { git = "https://github.com/Lightprotocol/light-protocol", branch = "fix/authority-owner-mutability", features = ["v2", "cpi-context"] }
light-account = { git = "https://github.com/Lightprotocol/light-protocol", branch = "fix/authority-owner-mutability", features = ["anchor", "token"] }
light-compressible = { git = "https://github.com/Lightprotocol/light-protocol", branch = "fix/authority-owner-mutability", features = ["anchor"] }
light-hasher = { git = "https://github.com/Lightprotocol/light-protocol", branch = "fix/authority-owner-mutability", features = ["solana"] }
light-macros = { git = "https://github.com/Lightprotocol/light-protocol", branch = "fix/authority-owner-mutability" }
light-compressed-account = { git = "https://github.com/Lightprotocol/light-protocol", branch = "fix/authority-owner-mutability" }
light-token = { git = "https://github.com/Lightprotocol/light-protocol", branch = "fix/authority-owner-mutability", features = ["anchor"] }
light-token-types = { git = "https://github.com/Lightprotocol/light-protocol", branch = "fix/authority-owner-mutability", features = ["anchor"] }
light-token-interface = { git = "https://github.com/Lightprotocol/light-protocol", branch = "fix/authority-owner-mutability" }
light-program-test = { git = "https://github.com/Lightprotocol/light-protocol", branch = "fix/authority-owner-mutability" }
light-client = { git = "https://github.com/Lightprotocol/light-protocol", branch = "fix/authority-owner-mutability", features = ["v2", "anchor"] }
light-anchor-spl = "0.31.1"

# Testing
tokio = "1.43.0"
borsh = "0.10.4"

# Pin time to avoid time-macros 0.2.26 which requires edition2024
# (cargo build-sbf bundles Cargo 1.84.0 which doesn't support it)
time = "=0.3.41"

# Internal
shared-test-utils = { path = "shared-test-utils" }
test-utils = { path = "basic-instructions/test-utils" }
