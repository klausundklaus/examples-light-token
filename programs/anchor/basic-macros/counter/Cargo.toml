[package]
name = "counter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "counter"

[features]
no-entrypoint = []
no-log-ix-name = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "light-sdk/idl-build"]
test-sbf = []

[dependencies]
anchor-lang = { workspace = true }
blake3 = { workspace = true }
light-account = { version = "0.20.0", features = ["anchor"] }
light-compressed-account = "0.10.1"
light-sdk = { version = "0.20.0", features = ["anchor", "cpi-context", "v2"] }
light-hasher = { workspace = true, features = ["solana"] }
solana-program = { workspace = true }
solana-pubkey = { workspace = true }
solana-account-info = { workspace = true }
solana-program-error = { workspace = true }
solana-msg = { workspace = true }

[dev-dependencies]
light-program-test = "0.20.0"
light-client = { version = "0.20.0", features = ["v2", "anchor"] }
tokio = { workspace = true, features = ["full"] }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
solana-instruction = { workspace = true }
solana-sdk = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
