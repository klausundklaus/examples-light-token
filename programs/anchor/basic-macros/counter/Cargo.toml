[package]
name = "counter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "counter"

[features]
no-entrypoint = []
no-log-ix-name = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "light-sdk/idl-build"]
test-sbf = []

[dependencies]
anchor-lang = { workspace = true, features = ["idl-build"] }
blake3 = { workspace = true }
light-sdk = { workspace = true, features = ["anchor", "anchor-discriminator", "idl-build", "cpi-context", "v2"] }
light-token = { workspace = true, features = ["anchor"] }
light-hasher = { workspace = true, features = ["solana"] }
solana-program = { workspace = true }
solana-pubkey = { workspace = true }
solana-account-info = { workspace = true }
solana-program-error = { workspace = true }
solana-msg = { workspace = true }

[dev-dependencies]
light-program-test = { workspace = true }
light-client = { workspace = true }
tokio = { workspace = true, features = ["full"] }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
solana-instruction = { workspace = true }
solana-sdk = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
