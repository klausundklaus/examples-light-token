[package]
name = "light-token-minter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "light_token_minter"

[features]
no-entrypoint = []
no-log-ix-name = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "light-sdk/idl-build", "light-token/idl-build", "light-anchor-spl/idl-build"]
test-sbf = []

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }

light-sdk = { workspace = true, features = ["anchor", "cpi-context", "v2"] }
light-token = { workspace = true, features = ["anchor"] }
light-account = { workspace = true }
# Required by LightAccount derive macro
light-hasher = { workspace = true, features = ["solana"] }
light-anchor-spl = { workspace = true }
solana-program = { workspace = true }
solana-pubkey = { workspace = true }
solana-account-info = { workspace = true }
solana-program-error = { workspace = true }
solana-msg = { workspace = true }

[dev-dependencies]
light-program-test = { workspace = true }
light-client = { workspace = true, features = ["v2", "anchor"] }
tokio = { workspace = true, features = ["full"] }
spl-token = { workspace = true }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
solana-instruction = { workspace = true }
solana-sdk = { workspace = true }
spl-token-2022 = { workspace = true }
spl-pod = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
