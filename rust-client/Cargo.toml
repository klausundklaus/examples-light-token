[package]
name = "rust-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Light Protocol SDKs
light-token = "0.4.0"
light-token-interface = "0.3.0"
light-token-client = "0.1.0"
light-program-test = { version = "0.19.0", features = ["v2"] }
light-client = { version = "0.19.0", features = ["v2"] }
light-nullifier-program = "0.1.2"

# Serialization
borsh = "0.10.4"

# Solana
solana-sdk = "2"
anchor-spl = "0.31"
spl-token = "7"
spl-token-2022 = "7"
spl-pod = "0.5"
solana-system-interface = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Utils
dotenv = "0.15"
rand = "0.8"
bs58 = "0.5"

# Pin blake3 to avoid constant_time_eq edition2024 issue
blake3 = "=1.5.5"

