[package]
name = "shared-test-utils"
version = "0.1.0"
description = "Shared test utilities for Light Protocol example programs"
edition = "2021"

[lib]
name = "shared_test_utils"

[dependencies]
# Light Protocol dependencies (from workspace)
light-program-test.workspace = true
light-client = { workspace = true, features = ["v2", "anchor"] }
light-sdk.workspace = true
light-token = { workspace = true, features = ["anchor"] }
light-hasher = { workspace = true, features = ["solana"] }

# Example program dependencies (for calling Light mint creation instructions)
light-token-minter = { path = "../light-token-minter" }

# Anchor dependencies
anchor-lang = { version = "=0.31.1" }
anchor-spl = { version = "0.31.1" }

# Solana dependencies
solana-keypair = { version = "2.2" }
solana-signer = { version = "2.2" }
solana-instruction = { version = "2.2" }
solana-sdk = { version = "2.3" }
solana-pubkey = { version = "2.2" }

# SPL Token dependencies
spl-token-2022 = "6.0.0"
spl-pod = "0.4.0"

# Async
tokio = { version = "1", features = ["full"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
]
