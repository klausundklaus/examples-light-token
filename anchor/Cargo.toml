[workspace]
resolver = "2"
members = [
    "programs/escrow",
    "programs/fundraiser",
    "programs/light-token-minter",
    "programs/token-swap",
    "programs/shared-test-utils",
]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
# Pin blake3 version for solana-program compatibility
blake3 = { version = "=1.8.2", default-features = false }

# Light Protocol dependencies
light-sdk = { git = "https://github.com/Lightprotocol/light-protocol", rev = "4115d257cd4ea582cc5e6ceb1480a9f45450fbb4" }
light-hasher = { git = "https://github.com/Lightprotocol/light-protocol", rev = "4115d257cd4ea582cc5e6ceb1480a9f45450fbb4" }
light-token = { git = "https://github.com/Lightprotocol/light-protocol", rev = "4115d257cd4ea582cc5e6ceb1480a9f45450fbb4" }
light-program-test = { git = "https://github.com/Lightprotocol/light-protocol", rev = "4115d257cd4ea582cc5e6ceb1480a9f45450fbb4" }
light-client = { git = "https://github.com/Lightprotocol/light-protocol", rev = "4115d257cd4ea582cc5e6ceb1480a9f45450fbb4" }
light-anchor-spl = { version = "0.31.1" }
shared-test-utils = { path = "programs/shared-test-utils" }
