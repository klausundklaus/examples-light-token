[workspace]
resolver = "2"
members = [
    "programs/escrow",
    "programs/fundraiser",
    "programs/light-token-minter",
    "programs/token-swap",
    "programs/shared-test-utils",
]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
# Pin blake3 version for solana-program compatibility
blake3 = { version = "=1.8.2", default-features = false }

# Light Protocol dependencies from crates.io
light-sdk = "0.19.0"
light-sdk-macros = "0.19.0"
light-hasher = "5.0.0"
light-token = "0.4.0"
light-program-test = "0.19.0"
light-client = "0.19.0"
light-anchor-spl = { version = "0.31.1", features = ["idl-build"] }
shared-test-utils = { path = "programs/shared-test-utils" }
