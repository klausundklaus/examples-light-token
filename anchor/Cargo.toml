[workspace]
resolver = "2"
members = [
    "programs/escrow",
    "programs/fundraiser",
    "programs/light-token-minter",
    "programs/token-swap",
]

[workspace.dependencies]
# Pin blake3 version for solana-program compatibility
blake3 = { version = "=1.8.2", default-features = false }

# Light Protocol dependencies from git
light-sdk = { git = "https://github.com/Lightprotocol/light-protocol", rev = "5a6ad4b1322482604aeacfc162de41b03a221760" }
light-sdk-macros = { git = "https://github.com/Lightprotocol/light-protocol", rev = "5a6ad4b1322482604aeacfc162de41b03a221760" }
light-hasher = { git = "https://github.com/Lightprotocol/light-protocol", rev = "5a6ad4b1322482604aeacfc162de41b03a221760" }
light-token = { git = "https://github.com/Lightprotocol/light-protocol", rev = "5a6ad4b1322482604aeacfc162de41b03a221760" }
light-program-test = { git = "https://github.com/Lightprotocol/light-protocol", rev = "5a6ad4b1322482604aeacfc162de41b03a221760" }
light-client = { git = "https://github.com/Lightprotocol/light-protocol", rev = "5a6ad4b1322482604aeacfc162de41b03a221760" }
light-anchor-spl = { version = "0.31.1", features = ["idl-build"] }
